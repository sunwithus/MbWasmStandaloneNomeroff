<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS</title>
<style>
  *{box-sizing:border-box}
  body{font-family:Manrope,Segoe UI,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;background:#F7F3EB;color:#1C2A26}
  h1{font-family:Fraunces,Georgia,serif;font-size:1.6rem;margin:0 0 6px}
  .sub{color:#5C6B64;font-size:.95rem;margin-bottom:20px}
  .btn{display:inline-block;padding:10px 16px;margin:4px 8px 4px 0;border:none;border-radius:10px;font-size:14px;cursor:pointer}
  .btn-primary{background:#0F6B5C;color:#fff}
  .btn-secondary{background:#FFFBF5;color:#1C2A26;border:1px solid #E0D8C8}
  .btn-success{background:#2F8F5B;color:#fff}
  .btn-danger{background:#C1453D;color:#fff}
  .cards{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
  .card{flex:1;min-width:200px;padding:14px;background:#FFFBF5;border:1px solid #E0D8C8;border-radius:12px}
  .card h3{font-size:.8rem;margin:0 0 8px;color:#5C6B64;text-transform:uppercase;letter-spacing:.04em}
  .card .value{font-size:1.15rem;font-weight:600;word-break:break-all}
  .result{background:#FFFBF5;border:1px solid #E0D8C8;border-radius:12px;padding:14px;margin:16px 0;min-height:72px;white-space:pre-wrap}
  .ok{color:#2F8F5B}.err{color:#C1453D}
  select{padding:8px;border-radius:8px;background:#FFFBF5;border:1px solid #E0D8C8}
</style>
</head><body>
    <h1>GPS-приёмник</h1>
    <p class="sub">NMEA через COM-порт · координаты для записей номеров</p>
    <div class="cards">
        <div class="card"><h3>Статус</h3><div class="value" id="status">—</div></div>
        <div class="card"><h3>Координаты</h3><div class="value" id="coords">—</div></div>
    </div>
    <p><strong>Порт:</strong> <select id="port"><option value="COM3">COM3</option></select>
        <button class="btn btn-secondary" onclick="refreshPorts()">Обновить</button></p>
    <button class="btn btn-primary" onclick="checkStatus()">Проверить</button>
    <button class="btn btn-success" onclick="connect()">Подключить</button>
    <button class="btn btn-danger" onclick="disconnect()">Отключить</button>
    <button class="btn btn-primary" onclick="getCoords()">Координаты</button>
    <div class="result" id="result">Выберите COM-порт и нажмите «Подключить».</div>
    <script>
        const r=document.getElementById('result'),s=document.getElementById('status'),c=document.getElementById('coords'),portSelect=document.getElementById('port');
        function show(txt,ok){r.textContent=txt;r.className='result '+(ok?'ok':'err')}
        function getPort(){return portSelect.value||'COM3'}
        function applyPos(d){
          if(d && d.hasPosition && typeof d.latitude==='number' && typeof d.longitude==='number'){
            c.textContent=d.latitude.toFixed(6)+', '+d.longitude.toFixed(6); return true;
          }
          c.textContent='—'; return false;
        }
        async function checkStatus(){try{const res=await fetch('/api/status');const d=await res.json();s.textContent=d.connected?'Подключено':'Нет';applyPos(d);show(JSON.stringify(d,null,2),true)}catch(e){show('Ошибка: '+e.message,false)}}
        async function refreshPorts(){try{const res=await fetch('/api/ports');const arr=await res.json();portSelect.innerHTML=arr.length?arr.map(p=>`<option value="${p}">${p}</option>`).join(''):'<option>COM3</option>';show('Порты: '+(arr.join(', ')||'пусто'),true)}catch(e){show('Ошибка: '+e.message,false)}}
        async function connect(){const port=getPort();try{const res=await fetch('/api/connect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({port})});const d=await res.json();show(d.success?'Подключено к '+port+'. Ждите фикса спутников.':'Не удалось подключиться к '+port,d.success);await checkStatus()}catch(e){show('Ошибка: '+e.message,false)}}
        async function getCoords(){try{const res=await fetch('/api/position');const d=await res.json();if(applyPos(d)){s.textContent='OK';show('Широта: '+d.latitude+'\nДолгота: '+d.longitude,true)}else show('Координат пока нет. Подключите GPS и подождите.',false)}catch(e){show('Ошибка: '+e.message,false)}}
        async function disconnect(){try{await fetch('/api/disconnect',{method:'POST'});s.textContent='—';c.textContent='—';show('Отключено',true)}catch(e){show('Ошибка: '+e.message,false)}}
        refreshPorts();
    </script>
</body></html>
