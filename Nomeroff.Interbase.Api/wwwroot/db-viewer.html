<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Просмотр БД — Nomeroff</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:20px;background:#0f1419;color:#e6edf3}
.container{max-width:1400px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 20px;color:#58a6ff}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.toolbar select{padding:8px 12px;border:1px solid #30363d;border-radius:6px;background:#21262d;color:#e6edf3;min-width:180px}
.toolbar button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:500}
.btn{background:#238636;color:#fff}
.btn:hover{background:#2ea043}
.btn-ghost{background:#21262d;color:#e6edf3;border:1px solid #30363d}
.btn-ghost:hover{background:#30363d}
.btn-danger{background:#da3633;color:#fff}
.btn-danger:hover{background:#f85149}
.status{padding:8px;border-radius:6px;font-size:14px}
.status.ok{background:#23863633;color:#7ee787}
.status.err{background:#da363333;color:#f85149}
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid #30363d}
table{width:100%;border-collapse:collapse;background:#161b22}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #21262d;vertical-align:middle}
th{background:#21262d;font-weight:600;white-space:nowrap}
tr:hover{background:#21262d}
.plate-text{font-family:ui-monospace,Consolas,monospace;font-size:1.05rem;font-weight:600;letter-spacing:.04em}
.conf{font-weight:600;white-space:nowrap}
.conf.hi{color:#7ee787}
.conf.mid{color:#e3b341}
.conf.lo{color:#f85149}
.thumbs{display:flex;gap:8px;align-items:center}
.thumb-wrap{display:flex;flex-direction:column;gap:4px;align-items:center}
.thumb-wrap span{font-size:11px;color:#8b949e}
.thumb{max-height:72px;max-width:160px;border-radius:4px;border:1px solid #30363d;cursor:pointer;background:#0d1117;object-fit:contain}
.thumb.plate{max-height:56px;max-width:140px;image-rendering:auto}
.thumb.missing{width:80px;height:48px;display:flex;align-items:center;justify-content:center;color:#8b949e;font-size:11px;cursor:default}
.row-actions{display:flex;gap:6px}
.empty{padding:40px;text-align:center;color:#8b949e}
input[name=newdb]{padding:8px 12px;border:1px solid #30363d;border-radius:6px;background:#21262d;color:#e6edf3;width:160px}
.lightbox{display:none;position:fixed;inset:0;background:#000c;z-index:50;align-items:center;justify-content:center;padding:24px}
.lightbox.show{display:flex}
.lightbox img{max-width:96vw;max-height:92vh;border-radius:8px;box-shadow:0 8px 40px #000a}
</style></head><body>
<div class="container">
  <h1>Просмотр БД Interbase</h1>
  <div class="toolbar">
    <select id="dbSelect" onchange="onDbChange()"><option value="">— Выберите БД —</option></select>
    <button class="btn" onclick="load()">Обновить</button>
    <button class="btn-ghost" onclick="prevPage()" id="btnPrev">←</button>
    <span id="pageInfo" style="color:#8b949e;font-size:14px"></span>
    <button class="btn-ghost" onclick="nextPage()" id="btnNext">→</button>
    <button class="btn-ghost" onclick="testConn()">Тест</button>
    <button class="btn-ghost" onclick="testWrite()">Тест запись</button>
    <span id="status" class="status"></span>
    <span style="margin-left:auto">
      <input type="text" name="newdb" placeholder="Имя новой БД" id="newDbName" />
      <button class="btn" onclick="createDb()">Создать БД</button>
      <button class="btn-ghost btn-danger" onclick="deleteDb()" title="Удалить выбранную БД">Удалить БД</button>
    </span>
  </div>
  <div class="table-wrap">
    <table><thead><tr>
      <th>ID</th><th>Устройство</th><th>Дата</th><th>Номер</th><th>Увер.</th><th>Кадр</th><th>Номер (кроп)</th><th>Широта</th><th>Долгота</th><th></th>
    </tr></thead><tbody id="tbody"></tbody></table>
  </div>
</div>
<div id="lightbox" class="lightbox" onclick="closeLightbox()"><img id="lightboxImg" alt=""></div>
<script>
const base='{baseUrl}';
let currentDb='';
let pageOffset=0;
const pageLimit=100;

function imgUrl(kind,id){
  const path=kind==='plate'?'/api/db/plate-image/':'/api/db/image/';
  return base+path+id+'?db='+encodeURIComponent(currentDb);
}
function openLightbox(url){
  const box=document.getElementById('lightbox');
  document.getElementById('lightboxImg').src=url;
  box.classList.add('show');
}
function closeLightbox(){document.getElementById('lightbox').classList.remove('show')}
function confClass(s){
  const n=parseInt(String(s||'').replace('%',''),10);
  if(isNaN(n)) return '';
  if(n>=80) return 'hi';
  if(n>=60) return 'mid';
  return 'lo';
}
function thumbCell(kind,id,has){
  if(!has) return '<div class="thumb-wrap"><div class="thumb missing">нет</div></div>';
  const url=imgUrl(kind,id);
  const cls=kind==='plate'?'thumb plate':'thumb';
  return '<div class="thumb-wrap"><img class="'+cls+'" src="'+url+'" loading="lazy" alt="" onclick="openLightbox(\''+url+'\')" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'thumb missing\',textContent:\'нет\'}))"/></div>';
}

async function loadDbs(){
  const r=await fetch(base+'/api/db/list');
  const j=await r.json();
  const sel=document.getElementById('dbSelect');
  sel.innerHTML='<option value="">— Выберите БД —</option>';
  for(const d of j.databases||[]){
    const o=document.createElement('option');
    o.value=d;o.textContent=d;
    sel.appendChild(o);
  }
}

async function onDbChange(){
  currentDb=document.getElementById('dbSelect').value;
  pageOffset=0;
  if(currentDb) load();
  else document.getElementById('tbody').innerHTML='<tr><td colspan=10 class=empty>Выберите БД</td></tr>';
}

function prevPage(){ if(pageOffset<=0)return; pageOffset=Math.max(0,pageOffset-pageLimit); load(); }
function nextPage(){ pageOffset+=pageLimit; load(); }

async function load(){
  if(!currentDb){document.getElementById('status').textContent='Выберите БД';document.getElementById('status').className='status err';return}
  const tbody=document.getElementById('tbody');
  tbody.innerHTML='<tr><td colspan=10>Загрузка...</td></tr>';
  try{
    const r=await fetch(base+'/api/db/records?db='+encodeURIComponent(currentDb)+'&limit='+pageLimit+'&offset='+pageOffset);
    const j=await r.json();
    if(j.message){
      tbody.innerHTML='<tr><td colspan=10 class=empty>'+j.message+'</td></tr>';
      return;
    }
    const total=j.total||0;
    if(pageOffset>0 && (!j.records||j.records.length===0) && total>0){
      pageOffset=Math.max(0, pageOffset-pageLimit);
      return load();
    }
    let html='';
    for(const row of j.records||[]){
      const dt=row.s_DATETIME?new Date(row.s_DATETIME).toLocaleString('ru'):'';
      const belong=row.s_BELONG||'';
      const confCls=confClass(belong);
      html+='<tr>'
        +'<td>'+row.s_INCKEY+'</td>'
        +'<td>'+escapeHtml(row.s_DEVICEID||'')+'</td>'
        +'<td>'+dt+'</td>'
        +'<td class="plate-text">'+escapeHtml(row.s_NOTICE||'')+'</td>'
        +'<td class="conf '+confCls+'">'+escapeHtml(belong||'—')+'</td>'
        +'<td>'+thumbCell('full',row.s_INCKEY,!!row.hasFoto)+'</td>'
        +'<td>'+thumbCell('plate',row.s_INCKEY,!!row.hasPlate)+'</td>'
        +'<td>'+(row.s_LATITUDE??'')+'</td>'
        +'<td>'+(row.s_LONGITUDE??'')+'</td>'
        +'<td class=row-actions><button class="btn-ghost btn-danger" onclick="delRecord('+row.s_INCKEY+')" title="Удалить">✕</button></td>'
        +'</tr>';
    }
    tbody.innerHTML=html||'<tr><td colspan=10 class=empty>Нет записей</td></tr>';
    const from=total===0?0:pageOffset+1;
    const to=pageOffset+(j.records?.length||0);
    document.getElementById('pageInfo').textContent=total? (from+'-'+to+' / '+total) : '';
    document.getElementById('btnPrev').disabled=pageOffset<=0;
    document.getElementById('btnNext').disabled=pageOffset+pageLimit>=total;
    document.getElementById('status').textContent='Страница: '+(j.records?.length||0)+' из '+total;
    document.getElementById('status').className='status ok';
  }catch(e){
    tbody.innerHTML='<tr><td colspan=10 class=empty>Ошибка: '+escapeHtml(e.message)+'</td></tr>';
    document.getElementById('status').textContent='Ошибка';
    document.getElementById('status').className='status err';
  }
}

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

async function delRecord(id){
  if(!confirm('Удалить запись '+id+'?'))return;
  const r=await fetch(base+'/api/db/records/'+id+'?db='+encodeURIComponent(currentDb),{method:'DELETE'});
  const j=await r.json();
  if(j.success)load();else alert('Ошибка удаления');
}

async function testConn(){
  if(!currentDb){document.getElementById('status').textContent='Выберите БД';document.getElementById('status').className='status err';return}
  const r=await fetch(base+'/api/db/test?db='+encodeURIComponent(currentDb));
  const j=await r.json();
  document.getElementById('status').textContent=j.message||(j.success?'OK':'Ошибка');
  document.getElementById('status').className='status '+(j.success?'ok':'err');
}

async function testWrite(){
  if(!currentDb){alert('Выберите БД');return}
  const r=await fetch(base+'/api/db/test-write?db='+encodeURIComponent(currentDb),{method:'POST'});
  let j; try{j=await r.json()}catch{j={}};
  if(j.success){load();document.getElementById('status').textContent='Записано id='+j.id;document.getElementById('status').className='status ok'}
  else alert('Ошибка: '+(j.detail||j.message||j.title||r.statusText||'неизвестная'));
}
async function deleteDb(){
  if(!currentDb){alert('Выберите БД');return}
  if(!confirm('Удалить БД '+currentDb+'? Все данные будут потеряны!'))return;
  const r=await fetch(base+'/api/db/delete?db='+encodeURIComponent(currentDb),{method:'DELETE'});
  const j=await r.json();
  alert(j.message);
  if(j.success){currentDb='';await loadDbs();document.getElementById('tbody').innerHTML='<tr><td colspan=10 class=empty>Выберите БД</td></tr>'}
}
async function createDb(){
  const name=document.getElementById('newDbName').value.trim();
  if(!name){alert('Введите имя БД');return}
  const r=await fetch(base+'/api/db/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  const j=await r.json();
  alert(j.message);
  if(j.success){await loadDbs();document.getElementById('newDbName').value=''}
}

loadDbs();
</script></body></html>
